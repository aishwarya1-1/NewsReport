name: Send News Summary

on:
  schedule:
    - cron: '0 9 * * *'  # Runs at 9 AM UTC every day
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'  # Enable built-in pip caching

      - name: Get pip cache dir
        id: pip-cache
        run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: |
            ${{ steps.pip-cache.outputs.dir }}
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-${{ hashFiles('setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          
          # Create requirements.txt with minimal dependencies
          cat > requirements.txt << EOL
          crewai==0.102.0
          crewai-tools>=0.4.26
          streamlit
          mailchimp-marketing>=3.0.80
          python-dotenv>=1.0.0
          markdown>=3.5.2
          requests>=2.31.0
          EOL
          
          # Install with optimizations
          pip install --no-cache-dir --compile -r requirements.txt

      - name: Run script
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_SERVER_PREFIX: ${{ secrets.MAILCHIMP_SERVER_PREFIX }}
          LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PYTHONOPTIMIZE: 2  # Enable Python optimizations
        run: |
          cd crewOpenAI
          python -OO crew.py  # Run with optimizations

      - name: Cleanup pip cache
        run: |
          pip cache purge
          rm -rf ~/.cache/pip

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add crewOpenAI/new-blog-post.md
          git commit -m 'Update news content'
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
