name: Send News Summary

on:
  schedule:
    - cron: '0 9 * * *'  # Runs at 9 AM UTC every day
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Create and install requirements
        run: |
          python -m pip install --upgrade pip

          # Create requirements.txt with minimal dependencies
          cat > requirements.txt << EOL
          crewai==0.102.0
          crewai-tools>=0.4.26
          streamlit
          mailchimp-marketing>=3.0.80
          python-dotenv>=1.0.0
          markdown>=3.5.2
          requests>=2.31.0
          EOL

          pip install -r requirements.txt

      - name: Run script
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_SERVER_PREFIX: ${{ secrets.MAILCHIMP_SERVER_PREFIX }}
          LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          cd crewOpenAI
          python crew.py

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add crewOpenAI/new-blog-post.md
          git commit -m 'Update news content'
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}